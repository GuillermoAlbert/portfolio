  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

======================================================= */\n\n:root {\n  --navy:        #11203a;\n  --blue:        #2563a8;\n  --ink:         #1a1a1a;\n  --ink-soft:    #444444;\n  --muted:       #555555;\n  --muted-2:     #6a7280;\n  --bg:          #ffffff;\n  --sand:        #f7f4ef;\n  --surface-hi:  #fcfbf9;   /* card hover */\n  --pg:          #336791;   /* postgres tag */\n  --on-navy:     #ffffff;   /* text on a navy/strong fill */\n  --topbar-bg:   rgba(255, 255, 255, 0.86);\n\n  /* hairlines derived from navy */\n  --line:        rgba(17, 32, 58, 0.14);\n  --line-strong: rgba(17, 32, 58, 0.30);\n\n  --maxw:        1160px;\n  --gutter:      clamp(20px, 5vw, 64px);\n\n  --mono: \"JetBrains Mono\", ui-monospace, SFMono-Regular, Menlo, monospace;\n  --sans: \"Inter\", system-ui, -apple-system, \"Helvetica Neue\", Arial, sans-serif;\n}\n\n* { margin: 0; padding: 0; box-sizing: border-box; }\n\nhtml { scroll-behavior: smooth; }\n@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }\n\nbody {\n  font-family: var(--sans);\n  font-weight: 400;\n  color: var(--ink);\n  background: var(--bg);\n  transition: background-color 0.32s ease, color 0.32s ease;\n  line-height: 1.55;\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n  font-feature-settings: \"cv05\" 1, \"ss01\" 1;\n}\n\na { color: inherit; text-decoration: none; }\n\n.container {\n  width: 100%;\n  max-width: var(--maxw);\n  margin-inline: auto;\n  padding-inline: var(--gutter);\n}\n\n.mono {\n  font-family: var(--mono);\n  font-weight: 400;\n  font-feature-settings: normal;\n}\n\n/* ---------- skip link ---------- */\n.skip {\n  position: absolute; left: -999px; top: 0;\n  background: var(--navy); color: var(--on-navy); padding: 10px 14px;\n  font-family: var(--mono); font-size: 0.8rem; z-index: 100;\n}\n.skip:focus { left: 12px; top: 12px; }\n\n/* =============================================================\n   TOP BAR\n   ============================================================= */\n.topbar {\n  position: sticky; top: 0; z-index: 50;\n  background: var(--topbar-bg);\n  backdrop-filter: saturate(140%) blur(6px);\n  border-bottom: 1px solid var(--line);\n}\n.topbar__inner {\n  display: flex; align-items: center; justify-content: space-between;\n  height: 60px;\n}\n.brand {\n  font-family: var(--mono);\n  font-size: 0.82rem;\n  letter-spacing: 0.02em;\n  color: var(--navy);\n  display: inline-flex; align-items: center; gap: 9px;\n}\n.brand__dot {\n  width: 7px; height: 7px; background: var(--blue);\n  border-radius: 50%; display: inline-block;\n}\n.brand b { font-family: var(--sans); font-weight: 700; }\n.brand span { color: var(--muted-2); }\n\n.nav {\n  display: flex; align-items: center; gap: clamp(14px, 2.4vw, 30px);\n}\n.nav a {\n  font-family: var(--mono);\n  font-size: 0.78rem;\n  color: var(--muted);\n  letter-spacing: 0.01em;\n  position: relative;\n  padding: 4px 0;\n  transition: color 0.18s ease;\n}\n.nav a .idx { color: var(--blue); margin-right: 4px; }\n.nav a:hover { color: var(--navy); }\n.nav a.is-active { color: var(--navy); }\n.nav a.is-active::after {\n  content: \"\"; position: absolute; left: 0; right: 0; bottom: -2px;\n  height: 1.5px; background: var(--navy);\n}\n.nav a.navlink { display: none; }\n@media (min-width: 720px) { .nav a.navlink { display: inline-block; } }\n\n.langtoggle {\n  display: inline-flex; border: 1px solid var(--line-strong);\n  border-radius: 3px; overflow: hidden; font-family: var(--mono);\n  font-size: 0.72rem;\n}\n.langtoggle button {\n  background: transparent; border: 0; cursor: pointer;\n  padding: 5px 9px; color: var(--muted); font: inherit;\n  transition: background 0.15s ease, color 0.15s ease;\n}\n.langtoggle button.is-on { background: var(--navy); color: var(--on-navy); }\n\n/* =============================================================\n   SECTION SCAFFOLD\n   ============================================================= */\n.section { padding-block: clamp(56px, 9vw, 116px); }\n.section--sand { background: var(--sand); border-block: 1px solid var(--line); }\n\n.section-head {\n  display: grid;\n  grid-template-columns: auto 1fr auto;\n  align-items: baseline;\n  gap: 16px;\n  padding-bottom: 14px;\n  margin-bottom: clamp(30px, 5vw, 54px);\n  border-bottom: 1.5px solid var(--navy);\n}\n.sec-index {\n  font-family: var(--mono); font-size: 0.82rem;\n  color: var(--blue); letter-spacing: 0.04em;\n}\n.sec-title {\n  font-size: clamp(1.35rem, 3.4vw, 2.1rem);\n  font-weight: 700; color: var(--navy);\n  letter-spacing: -0.02em; line-height: 1.05;\n}\n.sec-note {\n  font-family: var(--mono); font-size: 0.74rem;\n  color: var(--muted-2); justify-self: end; text-align: right;\n}\n@media (max-width: 560px) {\n  .section-head { grid-template-columns: auto 1fr; }\n  .sec-note { display: none; }\n}\n\n/* =============================================================\n   HERO\n   ============================================================= */\n.hero { padding-top: clamp(48px, 8vw, 96px); padding-bottom: clamp(48px, 8vw, 100px); }\n.hero__grid {\n  display: grid;\n  grid-template-columns: 1fr;\n  gap: clamp(36px, 5vw, 64px);\n}\n@media (min-width: 880px) {\n  .hero__grid { grid-template-columns: minmax(0, 1.65fr) minmax(240px, 0.9fr); }\n}\n\n.hero__eyebrow {\n  font-family: var(--mono); font-size: 0.8rem;\n  color: var(--muted); letter-spacing: 0.02em;\n  display: inline-flex; align-items: center; gap: 9px;\n  margin-bottom: clamp(20px, 3.5vw, 30px);\n}\n.status-dot {\n  width: 8px; height: 8px; border-radius: 50%;\n  background: #1f9d57; box-shadow: 0 0 0 0 rgba(31,157,87,0.5);\n  display: inline-block;\n}\n@media (prefers-reduced-motion: no-preference) {\n  .status-dot { animation: pulse 2.6s ease-out infinite; }\n}\n@keyframes pulse {\n  0%   { box-shadow: 0 0 0 0 rgba(31,157,87,0.45); }\n  70%  { box-shadow: 0 0 0 7px rgba(31,157,87,0); }\n  100% { box-shadow: 0 0 0 0 rgba(31,157,87,0); }\n}\n\n.hero__name {\n  font-size: clamp(2.9rem, 9.2vw, 6.3rem);\n  font-weight: 700;\n  line-height: 0.98;\n  letter-spacing: -0.035em;\n  color: var(--navy);\n  text-wrap: balance;\n}\n.hero__role {\n  margin-top: clamp(16px, 2.4vw, 22px);\n  font-size: clamp(1.05rem, 2.5vw, 1.45rem);\n  font-weight: 600; color: var(--blue);\n  letter-spacing: -0.01em;\n}\n.hero__role .sep { color: var(--line-strong); font-weight: 400; padding-inline: 4px; }\n\n.hero__anchor {\n  margin-top: clamp(26px, 4vw, 38px);\n  max-width: 30ch;\n  font-size: clamp(1.25rem, 3vw, 1.85rem);\n  font-weight: 400;\n  line-height: 1.32;\n  color: var(--ink);\n  letter-spacing: -0.012em;\n  text-wrap: pretty;\n}\n.hero__anchor .hi { color: var(--navy); font-weight: 600; }\n\n.hero__links {\n  margin-top: clamp(30px, 4.5vw, 44px);\n  display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: center;\n}\n.linkmono {\n  font-family: var(--mono); font-size: 0.84rem; color: var(--navy);\n  display: inline-flex; align-items: center; gap: 8px;\n  padding: 7px 0; position: relative;\n  transition: color 0.18s ease;\n}\n.linkmono::after {\n  content: \"\"; position: absolute; left: 0; bottom: 2px; height: 1.5px;\n  width: 100%; background: var(--line-strong);\n  transform: scaleX(0); transform-origin: left; transition: transform 0.22s ease;\n}\n.linkmono:hover { color: var(--blue); }\n.linkmono:hover::after { transform: scaleX(1); background: var(--blue); }\n.linkmono .arr { transition: transform 0.22s ease; }\n.linkmono:hover .arr { transform: translate(2px, -2px); }\n\n/* hero spec sheet */\n.spec {\n  border: 1px solid var(--line-strong);\n  border-radius: 4px;\n  align-self: start;\n}\n.spec__bar {\n  display: flex; align-items: center; gap: 7px;\n  padding: 10px 14px; border-bottom: 1px solid var(--line);\n  font-family: var(--mono); font-size: 0.72rem; color: var(--muted-2);\n  letter-spacing: 0.02em;\n}\n.spec__bar .b { width: 9px; height: 9px; border: 1px solid var(--line-strong); border-radius: 2px; }\n.spec__rows { padding: 6px 0; }\n.spec__row {\n  display: grid; grid-template-columns: 92px 1fr; gap: 12px;\n  padding: 9px 14px; font-family: var(--mono); font-size: 0.78rem;\n}\n.spec__row + .spec__row { border-top: 1px dashed var(--line); }\n.spec__k { color: var(--muted-2); letter-spacing: 0.03em; }\n.spec__v { color: var(--navy); }\n.spec__v em { font-style: normal; color: var(--blue); }\n\n/* =============================================================\n   PROJECTS\n   ============================================================= */\n.cards {\n  display: grid; grid-template-columns: 1fr; gap: 1px;\n  background: var(--line); border: 1px solid var(--line);\n}\n@media (min-width: 760px) { .cards { grid-template-columns: 1fr 1fr; } }\n\n.card {\n  background: var(--bg);\n  padding: clamp(24px, 3.4vw, 38px);\n  display: flex; flex-direction: column;\n  position: relative;\n  transition: background 0.2s ease;\n}\n.card::before {\n  content: \"\"; position: absolute; left: 0; top: 0; height: 2px; width: 0;\n  background: var(--navy); transition: width 0.32s cubic-bezier(.4,0,.2,1);\n}\n.card:hover::before { width: 100%; }\n.card:hover { background: var(--surface-hi); }\n\n.card__top {\n  display: flex; align-items: baseline; justify-content: space-between;\n  gap: 12px; margin-bottom: 18px;\n}\n.card__idx { font-family: var(--mono); font-size: 0.8rem; color: var(--blue); }\n.card__year { font-family: var(--mono); font-size: 0.74rem; color: var(--muted-2); }\n\n.card__title {\n  font-size: clamp(1.25rem, 2.6vw, 1.6rem);\n  font-weight: 700; color: var(--navy); letter-spacing: -0.02em;\n  line-height: 1.12;\n}\n.card__kicker {\n  font-family: var(--mono); font-size: 0.74rem; color: var(--muted);\n  margin-top: 8px; letter-spacing: 0.01em;\n}\n.card__desc {\n  margin-top: 16px; color: var(--ink-soft); font-size: 0.985rem;\n  max-width: 46ch;\n}\n.card__metrics {\n  margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px 14px;\n  font-family: var(--mono); font-size: 0.74rem; color: var(--muted);\n}\n.card__metrics b { color: var(--navy); font-weight: 700; }\n\n.tags {\n  margin-top: 22px; display: flex; flex-wrap: wrap; gap: 7px;\n}\n.tag {\n  font-family: var(--mono); font-size: 0.715rem; letter-spacing: 0.01em;\n  color: var(--navy); border: 1px solid var(--line-strong);\n  border-radius: 2px; padding: 3px 8px; white-space: nowrap;\n  transition: border-color 0.15s ease, color 0.15s ease;\n}\n.tag--fe   { color: var(--blue); }\n.tag--db   { color: var(--pg); }\n.tag--infra{ color: var(--muted); }\n.tag--mut  { color: var(--muted-2); border-style: dashed; }\n\n.card__actions {\n  margin-top: auto; padding-top: 26px;\n  display: flex; flex-wrap: wrap; gap: 10px;\n}\n.btn {\n  font-family: var(--mono); font-size: 0.78rem;\n  display: inline-flex; align-items: center; gap: 8px;\n  padding: 9px 15px; border: 1px solid var(--navy);\n  color: var(--navy); border-radius: 3px; cursor: pointer;\n  transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;\n}\n.btn:hover { background: var(--navy); color: var(--on-navy); }\n.btn:hover .arr { transform: translateX(2px); }\n.btn .arr { transition: transform 0.18s ease; }\n.btn--ghost { border-color: var(--line-strong); color: var(--muted); }\n.btn--ghost:hover { background: transparent; border-color: var(--navy); color: var(--navy); }\n\n/* =============================================================\n   ABOUT\n   ============================================================= */\n.about__grid {\n  display: grid; grid-template-columns: 1fr; gap: clamp(34px, 5vw, 64px);\n}\n@media (min-width: 860px) {\n  .about__grid { grid-template-columns: minmax(0, 1.55fr) minmax(220px, 0.9fr); }\n}\n.about__quote {\n  font-size: clamp(1.4rem, 3.4vw, 2.05rem);\n  font-weight: 700; color: var(--navy); letter-spacing: -0.025em;\n  line-height: 1.18; max-width: 22ch; margin-bottom: clamp(26px, 4vw, 38px);\n  text-wrap: balance;\n}\n.about__quote .accent { color: var(--blue); }\n.about__body p {\n  color: var(--ink-soft); font-size: 1.04rem; max-width: 58ch;\n}\n.about__body p + p { margin-top: 16px; }\n.about__body strong { color: var(--ink); font-weight: 600; }\n\n.facts {\n  align-self: start;\n  border-top: 1.5px solid var(--navy);\n}\n.facts__row { padding: 14px 0; border-bottom: 1px solid var(--line); }\n.facts__k {\n  font-family: var(--mono); font-size: 0.7rem; color: var(--muted-2);\n  letter-spacing: 0.06em; display: block; margin-bottom: 5px;\n}\n.facts__v { font-size: 0.95rem; color: var(--navy); font-weight: 500; }\n.facts__v .sub { display: block; color: var(--ink-soft); font-weight: 400; font-size: 0.9rem; }\n\n/* =============================================================\n   CONTACT\n   ============================================================= */\n.contact__lead {\n  font-size: clamp(1.1rem, 2.6vw, 1.4rem); color: var(--ink-soft);\n  max-width: 36ch; margin-bottom: clamp(26px, 4vw, 36px);\n}\n.contact__email {\n  display: inline-block;\n  font-size: clamp(1.9rem, 7vw, 4.2rem);\n  font-weight: 700; color: var(--navy); letter-spacing: -0.035em;\n  line-height: 1.04; position: relative;\n  word-break: break-word;\n}\n.contact__email::after {\n  content: \"\"; position: absolute; left: 0; bottom: 4px; height: 3px; width: 100%;\n  background: var(--blue); transform: scaleX(0); transform-origin: left;\n  transition: transform 0.3s cubic-bezier(.4,0,.2,1);\n}\n.contact__email:hover::after { transform: scaleX(1); }\n.contact__row {\n  margin-top: clamp(30px, 4.5vw, 46px);\n  display: flex; flex-wrap: wrap; gap: 12px 28px;\n}\n\n/* =============================================================\n   FOOTER\n   ============================================================= */\n.footer { border-top: 1px solid var(--line); padding-block: 30px; }\n.footer__inner {\n  display: flex; flex-wrap: wrap; gap: 10px 24px;\n  align-items: center; justify-content: space-between;\n  font-family: var(--mono); font-size: 0.74rem; color: var(--muted-2);\n}\n.footer__inner a:hover { color: var(--navy); }\n\n/* =============================================================\n   REVEAL\n   ============================================================= */\n/* Reveal is OPT-IN: content is visible by default. JS adds\n   html.reveal-armed only after confirming animation frames run,\n   so a throttled / non-painting context always shows content. */\n@media (prefers-reduced-motion: no-preference) {\n  html.reveal-armed .reveal { opacity: 0; transform: translateY(16px); transition: opacity 0.6s ease, transform 0.6s ease; }\n  html.reveal-armed .reveal.is-in { opacity: 1; transform: none; }\n  html.reveal-armed .reveal[data-d=\"1\"] { transition-delay: 0.07s; }\n  html.reveal-armed .reveal[data-d=\"2\"] { transition-delay: 0.14s; }\n  html.reveal-armed .reveal[data-d=\"3\"] { transition-delay: 0.21s; }\n}\n\n:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 2px; }\n\n/* =============================================================\n   THEME TOGGLE (line icon) + CV DOWNLOAD\n   ============================================================= */\n.iconbtn {\n  display: inline-flex; align-items: center; justify-content: center;\n  width: 34px; height: 30px; padding: 0;\n  border: 1px solid var(--line-strong); border-radius: 3px;\n  background: transparent; cursor: pointer; color: var(--navy);\n  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;\n}\n.iconbtn:hover { border-color: var(--navy); color: var(--blue); }\n.iconbtn svg { width: 16px; height: 16px; display: block; }\n.themetoggle .ic-sun { display: none; }\n[data-theme=\"dark\"] .themetoggle .ic-sun { display: block; }\n[data-theme=\"dark\"] .themetoggle .ic-moon { display: none; }\n\n/* CV download — discreet bordered action that reads as a verb */\n.cvbtn {\n  font-family: var(--mono); font-size: 0.8rem;\n  display: inline-flex; align-items: center; gap: 9px;\n  padding: 8px 15px; border: 1px solid var(--navy); border-radius: 3px;\n  color: var(--navy); cursor: pointer;\n  transition: background 0.18s ease, color 0.18s ease;\n}\n.cvbtn:hover { background: var(--navy); color: var(--on-navy); }\n.cvbtn .dl { transition: transform 0.18s ease; }\n.cvbtn:hover .dl { transform: translateY(2px); }\n\n/* =============================================================\n   DARK MODE — navy base, lighter blue accents (per brand kit:\n   #2563a8 lacks contrast on navy, so accents lift to ~#6ea6e6).\n   Tokens are re-mapped; the rest of the sheet inherits.\n   ============================================================= */\n[data-theme=\"dark\"] {\n  --navy:        #eef2f8;   /* headings / name / strong fills → near-white */\n  --blue:        #6ea6e6;   /* links & accents, lifted for contrast on navy */\n  --ink:         #e7ecf4;   /* body text */\n  --ink-soft:    #c3ccdb;\n  --muted:       #98a4b9;\n  --muted-2:     #818ea4;\n  --pg:          #6fa9d2;   /* postgres tag, lightened */\n  --bg:          #0d1a31;   /* page */\n  --sand:        #142540;   /* elevated band (replaces sand) */\n  --surface-hi:  #15294a;   /* card hover */\n  --on-navy:     #0d1a31;   /* dark text on near-white fill */\n  --line:        rgba(255, 255, 255, 0.14);\n  --line-strong: rgba(255, 255, 255, 0.30);\n  --topbar-bg:   rgba(13, 26, 49, 0.85);\n}\n[data-theme=\"dark\"] .status-dot { background: #34c27a; }\n\n/* smooth the surfaces that don't already animate */\n.topbar, .spec, .section--sand, .facts__row, .footer {\n  transition: background-color 0.32s ease, border-color 0.32s ease, color 0.32s ease;\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body data-lang=\"es\">\n\n<a class=\"skip\" href=\"#work\" data-en=\"Skip to content\" data-fr=\"Aller au contenu\">Saltar al contenido<\u002Fa>\n\n<!-- ================= TOP BAR ================= -->\n<header class=\"topbar\">\n  <div class=\"container topbar__inner\">\n    <a class=\"brand\" href=\"#top\" aria-label=\"Guillermo Albert García\">\n      <span class=\"brand__dot\"><\u002Fspan>\n      <span><b>Guillermo div>\n\n      <aside class=\"spec reveal\" data-d=\"3\" aria-label=\"Resumen\">\n        <div class=\"spec__bar\">\n          <span class=\"b\" aria-hidden=\"true\"><\u002Fspan>\n          <span>~/ developer.profile<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"spec__rows\">\n          <div class=\"spec__row\">\n            <span class=\"spec__k\">LOCATION<\u002Fspan>\n            <span class=\"spec__v\" data-en=\"La Nucía, Alicante · Hybrid / Remote\" data-fr=\"La Nucía, Alicante · Hybride / À distance\">La Nucía, Alicante · Híbrido / Remoto<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"spec__row\">\n            <span class=\"spec__k\">FOCUS<\u002Fspan>\n            <span class=\"spec__v\"><em data-en=\"Backend-first\" data-fr=\"Backend-first\">Backend-first<\u002Fem> <span data-en=\"· architecture\" data-fr=\"· architecture\">· arquitectura<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"spec__row\">\n            <span class=\"spec__k\">STACK<\u002Fspan>\n            <span class=\"spec__v\">Java · Spring · JPA · Angular<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"spec__row\">\n            <span class=\"spec__k\">INFRA<\u002Fspan>\n            <span class=\"spec__v\">Proxmox · Docker · 9× LXC<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"spec__row\">\n            <span class=\"spec__k\">LANGS<\u002Fspan>\n            <span class=\"spec__v\">ES · FR · EN (C1)<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================= PROJECTS ================= -->\n  <section class=\"section\" id=\"work\">\n    <div class=\"container\">\n      <div class=\"section-head reveal\">\n        <span class=\"sec-index\">§ 01<\u002Fspan>\n        <h2 class=\"sec-title\" data-en=\"Selected work\" data-fr=\"Travaux sélectionnés\">Trabajo seleccionado<\u002Fh2>\n        <span class=\"sec-note mono\" data-en=\"// projects in production\" data-fr=\"// projets en production\">// proyectos en producción<\u002Fspan>\n      <\u002Fdiv>\n\n      <div class=\"cards reveal\" data-d=\"1\">\n\n        <!-- Card 1 — MAMS -->\n        <article class=\"card\">\n          <div class=\"card__top\">\n            <span class=\"card__idx\">01<\u002Fspan>\n            <span class=\"card__year\">2025 — Present<\u002Fspan>\n          <\u002Fdiv>\n          <h3 class=\"card__title\">MAMS — My Athlete Monitoring System<\u002Fh3>\n          <p class=\"card__kicker\" data-en=\"Sports-load monitoring SaaS\" data-fr=\"SaaS de suivi de charge sportive\">SaaS de monitorización de carga deportiva<\u002Fp>\n          <p class=\"card__desc\" data-en=\"A backend-first SaaS for semi-pro clubs and academies: multi-level permissions model, schema design with Liquibase, and GPS data ingested through an incremental ETL pipeline with idempotent upserts.\" data-fr=\"SaaS backend-first pour clubs et académies semi-professionnels : modèle de permissions multi-niveaux, conception du schéma avec Liquibase et ingestion de données GPS via un pipeline ETL incrémental avec upserts idempotents.\">\n            SaaS backend-first para clubes y academias semi-profesionales: modelo de permisos multinivel, diseño de esquema con Liquibase e ingesta de datos GPS mediante un pipeline ETL incremental con upserts idempotentes.\n          <\u002Fp>\n          <p class=\"card__metrics\">\n            <span data-en=\"&lt;b&gt;5&lt;/b&gt; transactional entities end-to-end\" data-fr=\"&lt;b&gt;5&lt;/b&gt; entités transactionnelles end-to-end\"><b>5<\u002Fb> entidades transaccionales end-to-end<\u002Fspan>\n            <span data-en=\"&lt;b&gt;Catapult&lt;/b&gt; GPS\" data-fr=\"&lt;b&gt;Catapult&lt;/b&gt; GPS\"><b>Catapult<\u002Fb> GPS<\u002Fspan>\n          <\u002Fp>\n          <div class=\"tags\" aria-label=\"Stack\">\n            <span class=\"tag\">Spring Boot<\u002Fspan>\n            <span class=\"tag\">Java 21<\u002Fspan>\n            <span class=\"tag\">Spring Security<\u002Fspan>\n            <span class=\"tag\">JWT<\u002Fspan>\n            <span class=\"tag tag--db\">PostgreSQL<\u002Fspan>\n            <span class=\"tag tag--db\">Liquibase<\u002Fspan>\n            <span class=\"tag tag--mut\">React<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"card__actions\">\n            <a class=\"btn\" href=\"#\" aria-disabled=\"true\"><span data-en=\"Live demo\" data-fr=\"Voir la démo\">Ver demo<\u002Fspan> <span class=\"arr\" aria-hidden=\"true\">→<\u002Fspan><\u002Fa>\n            <a class=\"btn btn--ghost\" href=\"https://github.com/GuillermoAlbert\" target=\"_blank\" rel=\"noopener\"><span data-en=\"Code\" data-fr=\"Code\">Código<\u002Fspan><\u002Fa>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n        <!-- Card 2 — Proxmox -->\n        <article class=\"card\">\n          <div class=\"card__top\">\n            <span class=\"card__idx\">02<\u002Fspan>\n            <span class=\"card__year\">2024 — Present<\u002Fspan>\n          <\u002Fdiv>\n          <h3 class=\"card__title\">Proxmox Home Server + Tailscale<\u002Fh3>\n          <p class=\"card__kicker\" data-en=\"Self-hosted infrastructure\" data-fr=\"Infrastructure auto-hébergée\">Infraestructura autoalojada<\u002Fp>\n          <p class=\"card__desc\" data-en=\"My own infrastructure running in production: 9 LXC containers, Python ETL pipelines (Catapult → PostgreSQL + Power BI), a self-built monitoring dashboard, and hands-on incident management with encrypted off-site backups.\" data-fr=\"Mon infrastructure en production : 9 conteneurs LXC, pipelines ETL en Python (Catapult → PostgreSQL + Power BI), un tableau de bord de supervision maison et une gestion réelle des incidents avec sauvegardes chiffrées externes.\">\n            Infraestructura propia corriendo en producción: 9 contenedores LXC, pipelines ETL en Python (Catapult → PostgreSQL + Power BI), un panel de monitorización propio y gestión real de incidentes con backups cifrados externos.\n          <\u002Fp>\n          <p class=\"card__metrics\">\n            <span data-en=\"&lt;b&gt;9&lt;/b&gt; LXC containers\" data-fr=\"&lt;b&gt;9&lt;/b&gt; conteneurs LXC\"><b>9<\u002Fb> contenedores LXC<\u002Fspan>\n            <span data-en=\"&lt;b&gt;77&lt;/b&gt;-test pytest suite\" data-fr=\"&lt;b&gt;77&lt;/b&gt; tests pytest\"><b>77<\u002Fb> tests pytest<\u002Fspan>\n          <\u002Fp>\n          <div class=\"tags\" aria-label=\"Stack\">\n            <span class=\"tag tag--infra\">Proxmox VE<\u002Fspan>\n            <span class=\"tag tag--infra\">Docker<\u002Fspan>\n            <span class=\"tag tag--infra\">LXC<\u002Fspan>\n            <span class=\"tag tag--infra\">Tailscale<\u002Fspan>\n            <span class=\"tag tag--db\">PostgreSQL<\u002Fspan>\n            <span class=\"tag tag--mut\">Python · ETL<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"card__actions\">\n            <a class=\"btn\" href=\"#\" aria-disabled=\"true\"><span data-en=\"Write-up\" data-fr=\"Détails\">Ver detalle<\u002Fspan> <span class=\"arr\" aria-hidden=\"true\">→<\u002Fspan><\u002Fa>\n            <a class=\"btn btn--ghost\" href=\"https://github.com/GuillermoAlbert\" target=\"_blank\" rel=\"noopener\"><span data-en=\"Code\" data-fr=\"Code\">Código<\u002Fspan><\u002Fa>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================= ABOUT ================= -->\n  <section class=\"section section--sand\" id=\"about\">\n    <div class=\"container\">\n      <div class=\"section-head reveal\">\n        <span class=\"sec-index\">§ 02<\u002Fspan>\n        <h2 class=\"sec-title\" data-en=\"About\" data-fr=\"À propos\">Sobre mí<\u002Fh2>\n        <span class=\"sec-note mono\">// biology → dev<\u002Fspan>\n      <\u002Fdiv>\n\n      <div class=\"about__grid\">\n        <div class=\"reveal\">\n          <p class=\"about__quote\" data-en=\"I treat backend the way I once treated the lab: &lt;span class=&quot;accent&quot;&gt;hypothesis, measure, iterate.&lt;/span&gt;\" data-fr=\"J'aborde le backend comme j'abordais le laboratoire : &lt;span class=&quot;accent&quot;&gt;hypothèse, mesurer, itérer.&lt;/span&gt;\">Abordo el backend como antes abordaba el laboratorio: <span class=\"accent\">hipótesis, medir, iterar.<\u002Fspan><\u002Fp>\n          <div class=\"about__body\">\n            <p data-en=\"I started in a lab — sequencing data, measuring biodiversity, defending every conclusion with evidence. Today I design APIs, model databases and deploy containers to production. The method barely changed.\" data-fr=\"J'ai commencé dans un laboratoire : à séquencer des données, mesurer la biodiversité et défendre chaque conclusion par des preuves. Aujourd'hui je conçois des API, modélise des bases de données et déploie des conteneurs en production. La méthode n'a presque pas changé.\">\n              Empecé en un laboratorio: secuenciando datos, midiendo biodiversidad y defendiendo cada conclusión con evidencia. Hoy diseño APIs, modelo bases de datos y despliego contenedores en producción. El método apenas cambió.\n            <\u002Fp>\n            <p data-en=\"My scientific background — a Biology degree, research, and a peer-reviewed publication — is the lens I bring to engineering: rigour, critical reading of the data, and the discipline of measuring before deciding.\" data-fr=\"Ma formation scientifique —une licence de Biologie, de la recherche et une publication évaluée par les pairs— est le prisme avec lequel j'aborde l'ingénierie : rigueur, lecture critique des données et la discipline de mesurer avant de décider.\">\n              Mi base científica —un Grado en Biología, investigación y una publicación revisada por pares— es la lente con la que abordo la ingeniería: rigor, lectura crítica de los datos y la disciplina de medir antes de decidir.\n            <\u002Fp>\n            <p data-en=\"I'm &lt;strong&gt;backend-first&lt;/strong&gt;. I care about architecture, the data model, and whether the system stays up when nobody is watching. I can hold my own on the frontend — but the backend is where I lead.\" data-fr=\"Je suis &lt;strong&gt;backend-first&lt;/strong&gt;. Ce qui m'importe : l'architecture, le modèle de données et que le système tienne debout quand personne ne regarde. Le frontend, je le défends ; le backend, je le mène.\">\n              Soy <strong>backend-first<\u002Fstrong>. Me importan la arquitectura, el modelo de datos y que el sistema siga en pie cuando nadie mira. El frontend lo defiendo; el backend lo lidero.\n            <\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <aside class=\"facts reveal\" data-d=\"1\" aria-label=\"Datos\">\n          <div class=\"facts__row\">\n            <span class=\"facts__k\">FORMACIÓN / EDUCATION<\u002Fspan>\n            <span class=\"facts__v\" data-en=\"BSc Biology (UA) · Web App Dev (DAW)\" data-fr=\"Licence de Biologie (UA) · DAW\">Grado en Biología (UA) · DAW<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"facts__row\">\n            <span class=\"facts__k\">INVESTIGACIÓN / RESEARCH<\u002Fspan>\n            <span class=\"facts__v\" data-en=\"Peer-reviewed publication (IBIS, 2022)&lt;span class=&quot;sub&quot;&gt;Wildlife detection with AI&lt;/span&gt;\" data-fr=\"Publication évaluée par les pairs (IBIS, 2022)&lt;span class=&quot;sub&quot;&gt;Détection de la faune par IA&lt;/span&gt;\">Publicación revisada por pares (IBIS, 2022)<span class=\"sub\">Detección de fauna con IA<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"facts__row\">\n            <span class=\"facts__k\">EXPERIENCIA / EXPERIENCE<\u002Fspan>\n            <span class=\"facts__v\" data-en=\"Full Stack Developer @ Inetum&lt;span class=&quot;sub&quot;&gt;France AgriMer · public sector&lt;/span&gt;\" data-fr=\"Full Stack Developer @ Inetum&lt;span class=&quot;sub&quot;&gt;France AgriMer · secteur public&lt;/span&gt;\">Full Stack Developer @ Inetum<span class=\"sub\">France AgriMer · sector público<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"facts__row\">\n            <span class=\"facts__k\">IDIOMAS / LANGUAGES<\u002Fspan>\n            <span class=\"facts__v\">ES <span data-en=\"native\" data-fr=\"natif\">nativo<\u002Fspan> · FR <span data-en=\"bilingual\" data-fr=\"bilingue\">bilingüe<\u002Fspan> · EN C1<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"facts__row\">\n            <span class=\"facts__k\">ENFOQUE / FOCUS<\u002Fspan>\n            <span class=\"facts__v\" data-en=\"Backend &amp; architecture\" data-fr=\"Backend &amp; architecture\">Backend &amp; arquitectura<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Faside>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ================= CONTACT ================= -->\n  <section class=\"section\" id=\"contact\">\n    <div class=\"container\">\n      <div class=\"section-head reveal\">\n        <span class=\"sec-index\">§ 03<\u002Fspan>\n        <h2 class=\"sec-title\" data-en=\"Contact\" data-fr=\"Contact\">Contacto<\u002Fh2>\n        <span class=\"sec-note mono\" data-en=\"// let's build something\" data-fr=\"// construisons quelque chose\">// construyamos algo<\u002Fspan>\n      <\u002Fdiv>\n\n      <p class=\"contact__lead reveal\" data-en=\"Got a backend that needs designing, a system that needs to stay up, or a project to talk through? Write to me.\" data-fr=\"Un backend à concevoir, un système à garder debout ou un projet à discuter ? Écrivez-moi.\">\n        ¿Un backend que diseñar, un sistema que mantener en pie o un proyecto del que hablar? Escríbeme.\n      <\u002Fp>\n\n      <a class=\"contact__email reveal\" data-d=\"1\" href=\"mailto:guillermo.albert@outlook.com\">guillermo.albert@outlook.com<\u002Fa>\n\n      <div class=\"contact__row reveal\" data-d=\"2\">\n        <a class=\"cvbtn\" data-cv=\"\" href=\"cv/Guillermo_Albert_CV_ES.pdf\" download=\"\">\n          <span data-en=\"Download CV\" data-fr=\"Télécharger le CV\">Descargar CV<\u002Fspan> <span class=\"dl\" aria-hidden=\"true\">↓<\u002Fspan>\n        <\u002Fa>\n        <a class=\"linkmono\" href=\"https://github.com/GuillermoAlbert\" target=\"_blank\" rel=\"noopener\">GitHub <span class=\"arr\" aria-hidden=\"true\">↗<\u002Fspan><\u002Fa>\n        <a class=\"linkmono\" href=\"https://linkedin.com/in/guillermo-albert-garcia\" target=\"_blank\" rel=\"noopener\">LinkedIn <span class=\"arr\" aria-hidden=\"true\">↗<\u002Fspan><\u002Fa>\n        <a class=\"linkmono\" href=\"tel:+34640347624\">(+34) 640 347 624 <span class=\"arr\" aria-hidden=\"true\">↗<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fmain>\n\n<!-- ================= FOOTER ================= -->\n<footer class=\"footer\">\n  <div class=\"container footer__inner\">\n    <span>© 2026 Guillermo Albert García<\u002Fspan>\n    <span data-en=\"Designed &amp; built in La Nucía, Alicante\" data-fr=\"Conçu et développé à La Nucía, Alicante\">Diseñado y construido en La Nucía, Alicante<\u002Fspan>\n    <a href=\"#top\" data-en=\"Back to top ↑\" data-fr=\"Retour en haut ↑\">Volver arriba ↑<\u002Fa>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n\n\n<script src=\"8d103b06-5c20-4f40-88e2-f60b96a23cd0\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
